<text x="20" y="568" font-size="13" fill="#ff8f3f" font-weight="600">&#9888; Pins 25 / 27 / 29 are HVIN and 28 / 30 are 5 V / battery.</text>
<text x="20" y="588" font-size="13" fill="#8d9aa8">Do not let a probe lead touch them, and never feed more than 3.3 V into a channel.</text>
<text x="20" y="614" font-size="13" fill="#8d9aa8">Use pins 1 / 3 / 5 (GND) as the common ground with the circuit under test.</text>
<text x="20" y="634" font-size="13" fill="#8d9aa8">CH3 / CH6 / CH7 share the M5-Bus SPI lines and CH5 shares PB_IN &#8212; avoid stacking a module that drives them.</text>

; ============================================================================
;  AtomS3 signal generator - a known-good external source for testing the
;  M5Tab5 Logic Analyzer.
;
;  Wire the output pin (G1 by default) to a probe channel on the Tab5 and tie
;  the grounds together.  Everything the analyzer had been validated against
;  until now came out of its own silicon; this gives it a genuinely independent
;  signal to read.
;
;  Build and flash separately from the firmware:
;      pio run -d tools/atoms3-siggen -t upload
; ============================================================================
[env:atoms3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino

upload_speed  = 1500000
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DSIGGEN_OUT_PIN=1
    -std=gnu++17
build_unflags = -std=gnu++11

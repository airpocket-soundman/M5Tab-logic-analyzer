; ============================================================================
;  M5Tab5 Logic Analyzer
;  Target : M5Stack Tab5 (ESP32-P4 + ESP32-C6)
;  Docs   : https://docs.m5stack.com/en/core/Tab5
; ============================================================================
[platformio]
default_envs = m5tab5

[env:m5tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv

upload_speed  = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Errors only: the USB CDC port doubles as the control API, and stray log
    ; lines would interleave with the JSON responses.  Hosts should still skip
    ; any line that does not start with '{'.
    -DCORE_DEBUG_LEVEL=1
    -DLA_BUILD_VERSION=\"0.1.0\"
    -std=gnu++17
    -O2
    ; The bundled SD_MMC library includes "FS.h" without declaring the
    ; dependency, which the LDF cannot resolve on its own.
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
build_unflags =
    -std=gnu++11

lib_deps =
    https://github.com/M5Stack/M5GFX.git
    https://github.com/M5Stack/M5Unified.git
    FS
    SD_MMC

lib_ldf_mode = deep+
